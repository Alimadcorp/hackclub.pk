<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Haven Events in Pakistan</title>
    <meta
      name="description"
      content="Hack Club Haven is a global game jam in 200+ cities worldwide for teenagers 13-18"
    />
    <meta property="og:title" content="Haven Events in Pakistan" />
    <meta
      property="og:description"
      content="Hack Club Haven is a global game jam in 200+ cities worldwide for students 13-18"
    />
    <meta
      property="og:image"
      content="https://haven.hackclub.com/images/haven-logo-color.webp"
    />
    <meta property="og:url" content="https://hackclub.pk" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Haven Events in Pakistan" />
    <meta
      name="twitter:description"
      content="Hack Club Haven is a global game jam in 200+ cities worldwide for students 13-18"
    />
    <meta
      name="twitter:image"
      content="https://haven.hackclub.com/images/haven-logo-color.webp"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script
      src="https://kit.fontawesome.com/25f9210ebd.js"
      crossorigin="anonymous"
    ></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="preconnect" href="https://forms.hackclub.com" />
    <link rel="icon" href="https://haven.hackclub.com/favicon.png" />
    <style>
      body {
        font-family: 'Inter', sans-serif;
      }
    </style>
    <style type="text/tailwindcss">
      @layer components {
        .card {
          @apply bg-black border border-zinc-800 rounded-2xl p-6 flex flex-col;
        }
        .btn-primary {
          @apply w-full h-10 bg-white text-zinc-950 font-bold flex items-center justify-center gap-2 rounded-full  transition-colors mb-4 border-transparent border-2 rounded-[1.25rem] hover:rounded-[0px] transition-all hover:border-2 hover:border-white;
        }
        .btn-social {
          @apply flex items-center justify-center gap-2 text-center bg-zinc-800 text-zinc-200 text-sm font-semibold h-10 px-3 rounded-[1.25rem] border-transparent border-2 hover:rounded-[0px] transition-all hover:border-2 hover:border-zinc-700;
        }
        .btn-social span {
          @apply flex items-center h-full;
        }
        .accordion-btn {
          @apply flex justify-between items-center w-full py-2 text-zinc-400 hover:text-white transition-colors;
        }
        .ph {
          @apply text-2xl;
        }
        ::selection {
          @apply text-black bg-white;
        }
        a {
          @apply relative overflow-hidden;
        }
        a::after {
          @apply content-[''] absolute top-0 right-0 w-0 h-full bg-white border-0 border-transparent rounded-[1.25rem] z-10 mix-blend-difference transition-[width,border-radius] ease-in pointer-events-none;
        }
        a:hover::after {
          @apply left-0 right-auto border-0 border-white rounded-none w-full transition-[width] ease-in;
        }
      }
    </style>
  </head>
  <body class="bg-zinc-950 text-zinc-100 min-h-screen antialiased p-6 md:p-12">
    <div class="max-w-7xl mx-auto mt-8">
      <div class="mb-12 text-center">
        <h1
          class="text-4xl md:text-5xl font-bold tracking-tight text-white mb-4"
        >
          Haven Events in Pakistan
        </h1>
        <p class="text-zinc-400 text-lg max-w-2xl mx-auto">
          Join the world's largest student-led game jam. Find your city, sign up
          for free, and get ready to cook.
        </p>
      </div>
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
