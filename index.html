<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preload" href="pakistan.geojson" as="fetch" crossorigin>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <link rel="stylesheet" href="style.css">
    <title>Haven Events in Pakistan</title>
    <meta
      name="description"
      content="Hack Club Haven is a global game jam in 200+ cities worldwide for teenagers 13-18"
    />
    <meta property="og:title" content="Haven Events in Pakistan" />
    <meta
      property="og:description"
      content="Hack Club Haven is a global game jam in 200+ cities worldwide for students 13-18"
    />
    <meta
      property="og:image"
      content="https://haven.hackclub.com/images/haven-logo-color.webp"
    />
    <meta property="og:url" content="https://hackclub.pk" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://forms.hackclub.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Ubuntu+Mono:ital,wght@0,400;0,600;1,400;1,600&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap"
      rel="stylesheet"
    />
    <script
      src="https://kit.fontawesome.com/25f9210ebd.js"
      crossorigin="anonymous"
    ></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="icon" href="https://haven.hackclub.com/favicon.png" />
    <style>
      body {
        font-family: 'Ubuntu', sans-serif;
      }
      .font-mono {
        font-family: 'Ubuntu Mono', monospace !important;
        font-weight: 600;
      }
    </style>
    <style type="text/tailwindcss">
      @layer components {
        .card {
          @apply bg-[#783D2B] border-2 border-[#783D2B] rounded-2xl p-6 flex flex-col;
        }
        .btn-primary {
          @apply w-full h-10 bg-[#F9DD60] text-[#783D2B] font-bold flex items-center justify-center gap-2 mb-4 border-2 border-transparent rounded-[1.25rem] transition-all hover:rounded-[0px] hover:bg-[#FC8616] hover:text-[#FFF4E0];
        }
        .btn-social {
          @apply flex items-center justify-center gap-2 text-center bg-[#DFA063] text-[#783D2B] text-sm font-semibold h-10 px-3 rounded-[1.25rem] border-transparent border-2 hover:rounded-[0px] transition-all hover:bg-[#F9DD60];
        }
        .btn-social span {
          @apply flex items-center h-full;
        }
        .accordion-btn {
          @apply flex justify-between items-center w-full py-2 text-[#FFF4E0] hover:text-[#F9DD60] transition-colors;
        }
        .ph {
          @apply text-2xl;
        }
        ::selection {
          @apply text-[#783D2B] bg-[#F9DD60];
        }
        a:not(.dont):not(.btn-primary):not(.btn-social) {
          @apply relative overflow-hidden;
        }
        a:not(.dont):not(.btn-primary):not(.btn-social)::after {
          @apply content-[''] absolute top-0 right-0 w-0 h-full bg-white border-0 border-transparent rounded-[1.25rem] z-[4] mix-blend-difference transition-[width,border-radius] ease-in pointer-events-none;
        }
        a:not(.dont):not(.btn-primary):not(.btn-social):hover::after {
          @apply left-0 right-auto border-0 border-white rounded-none w-full transition-[width] ease-in;
        }
      }
      .btn-primary, .btn-social, .accordion-btn {
        -webkit-tap-highlight-color: transparent;
      }
    </style>
  </head>
  <body class="bg-[#DFA063] text-[#783D2B] bg-[url('https://www.transparenttextures.com/patterns/asfalt-dark.png')] min-h-screen antialiased p-6 md:p-12">
    <a href="https://hackclub.com" class="dont hover:rotate-[5deg] hover:translate-y-3 transition-transform fixed z-[50] left-[-5px] top-0" target="_blank">
      <img src="flag.png" class="w-36 md:w-48">
    </a>
    <div class="max-w-7xl mx-auto mt-16 md:mt-8">
      <header class="mb-12 flex flex-col md:flex-row md:items-center md:justify-between gap-8">
        <div class="md:w-1/2 text-center md:text-left">
          <h1 class="text-4xl md:text-5xl font-bold tracking-tight text-[#783D2B] mb-4">
            Haven Events in Pakistan
          </h1>
          <p class="text-[#783D2B] text-sm md:text-lg max-w-2xl mx-auto md:mx-0 mb-4">
            Join the world's largest student-led game jam. Find your city, sign up
            for free, and get ready to cook.
          </p>
          <div class="p-2 flex items-center md:items-start justify-between flex-col w-full">
            <p class="text-[#783D2B] max-w-2xl md:text-md text-sm mb-0">Starting in</p>
            <h2 class="text-4xl md:text-8xl font-mono md:mt-[-10px]" id="clock" title="Sat 14 November, 2026 at 10 AM">31:01:01:00</h2>
            <p class="text-md text-[#783D2B] flex items-center gap-1">
              <i class="ph ph-eye text-[20px] translate-y-[0.5px]"></i>
              <span id="spec">1</span>
            </p>
          </div>
        </div>

        <div class="md:w-1/2">
          <div id="pakistan-map" class="w-full h-[400px] md:h-[550px]"></div>
        </div>
      </header>
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 items-start"></div>
    </div>
    <div id="s-modal" class="fixed inset-0 z-[100] flex items-center justify-center bg-black/70 md:backdrop-blur-sm opacity-0 pointer-events-none transition-all duration-200">
      <div class="card max-w-[90vw] w-md mx-4 p-6 relative border-[#783D2B]">
        <button id="close-mod" class="absolute top-2 right-2 text-[#DFA063] hover:text-[#783D2B] transition-colors">
          <i class="ph ph-x"></i>
        </button>
        <h3 id="mod-h" class="text-xl font-bold text-[#783D2B] mb-6 pr-6"></h3>
        <div class="flex flex-col gap-3">
          <a href="https://creators.hackclub.com/r/MHAMMGNA" target="_blank" class="btn-primary mb-0 text-center text-sm">
            I do not have a Slack account
          </a>
          <a id="si-btn" href="#" target="_blank" class="btn-social text-center text-sm py-2 h-10">
            I have Slack installed
          </a>
        </div>
      </div>
    </div>
    <footer class="text-center mt-10 text-[#783D2B]">
      Made with :3 and &lt;3 by
      <a class="dont hover:bg-[#783D2B] hover:text-[#F9DD60] hover:px-1" href="https://alimad.co" target="_blank">Muhammad Ali</a>
      and
      <a class="dont hover:bg-[#783D2B] hover:text-[#F9DD60] hover:px-1" href="https://adventurous-alisha.vercel.app" target="_blank">Alisha</a>.
    </footer>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="script.js"></script>
  </body>
</html>
